  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      color: #fff;
    }

    /* Fullscreen Background Image */ 
   @media (max-width: 600px) {
      .bg-image {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain !important;
  object-position: bottom left;
  z-index: 1;
  pointer-events: none;
}
    }

    /* Cursive Title at Top Left */
    .app-header {
      position: fixed;
      top: 25px;
      left: 35px;
      z-index: 10;
      pointer-events: none;
    }

    .app-header h1 {
      font-family: 'Great Vibes', 'Brush Script MT', cursive;
      font-size: 3.4rem;
      font-weight: 400;
      color: #ffb703;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.8);
      line-height: 1;
    }

    /* Top Right Container for Clock & Mute Button */
    .top-right-container {
      position: fixed;
      top: 25px;
      right: 35px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    /* Digital Time Display at Top Right */
    .time-display {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    /* Mute Button below Clock */
    .mute-btn {
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .mute-btn:hover {
      background: rgba(0, 0, 0, 0.85);
    }

.controls button {
  font-variant-emoji: text;
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: #ffffff;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.75rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease, color 0.15s ease;

  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  outline: none !important;
}

.controls button:focus,
.controls button:active,
.controls button:hover {
  background: rgba(255, 255, 255, 0.1) !important;
  color: #ffffff !important;
  outline: none !important;
  box-shadow: none !important;
}

@media (hover: hover) and (pointer: fine) {
  .controls button:hover {
    background: #ffb703 !important;
    color: #000000 !important;
  }
}

.controls button.is-pressed {
  background: #ffb703 !important;
  color: #000000 !important;
}

.controls button.is-active {
  background: #ffb703 !important;
  color: #000000 !important;
}

  #playBtn.is-paused {
  background: #ffb703 !important;
  color: #000000 !important;
}

    /* Minimalist Player Bar Overlay */
.player-bar {
  position: fixed;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 28px;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 50px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  transform-origin: bottom center;
}

.track-info {
  max-width: 220px;
  font-size: 1rem;
}

.volume-container input[type="range"] {
  width: 80px;
}

    .thumb {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #ffb703;
      flex-shrink: 0;
    }

    .thumb {      
  animation: slowRotate 8s linear infinite;
  animation-play-state: paused;
  }

  .thumb.is-playing {
  animation-play-state: running;
 }   

  @keyframes slowRotate {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
    
    .track-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 240px;
      overflow: hidden;
    }

    .track-title {
      font-size: 0.72rem;
      font-weight: 500;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .track-sub {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.68rem;
      display: flex;
      align-items: center;
      gap: 2px;
      margin-top: 2px;
    }

    .track-input {
      width: 32px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      color: #ffb703;
      font-size: 0.68rem;
      font-weight: 600;
      text-align: center;
      outline: none;
      padding: 0 2px;
      transition: all 0.2s ease;
    }

    .track-input:focus {
      border-color: #ffb703;
      background: rgba(0, 0, 0, 0.6);
    }

    .track-input::-webkit-outer-spin-button,
    .track-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .track-input[type=number] {
      -moz-appearance: textfield;
    }
 
    .controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .controls button {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .controls button:hover {
      background: #ffb703;
      color: #000;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      margin-left: 2px;
      flex-shrink: 0;
    }

    .volume-container input[type="range"] {
      width: 60px;
      accent-color: #ffb703;
      cursor: pointer;
    }

 }

  <script>
    /* Digital Clock Logic */
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockDisplay').innerText = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* Sleep Timer Logic */
    let sleepTimer = null, sleepRemain = 0;

    function openSleep() { 
      document.getElementById('sleepModal').classList.add('show'); 
    }

    function closeSleep() { 
      document.getElementById('sleepModal').classList.remove('show'); 
    }

    function setSleep(mins) {
      closeSleep();
      if (sleepTimer) clearInterval(sleepTimer);
      
      const btn = document.getElementById('sleepBtn');
      
      if (mins === 0) { 
        btn.innerHTML = '🌙 Sleep timer'; 
        return; 
      }
      
      sleepRemain = mins * 60;
      btn.innerHTML = `🌙 ${mins}:00`;
      
      sleepTimer = setInterval(() => {
        sleepRemain--;
        let m = Math.floor(sleepRemain / 60);
        let s = sleepRemain % 60;
        btn.innerHTML = `🌙 ${m}:${String(s).padStart(2, '0')}`;
        
        if (sleepRemain <= 0) {
          clearInterval(sleepTimer);
          if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
            ytPlayer.pauseVideo();
          }
          btn.innerHTML = '🌙 Sleep timer';
        }
      }, 1000);
    }

       /**
 * Fisher-Yates Shuffle algorithm.
 * Mutates the original array in-place, making the changes instantly visible
 * to any other function accessing `playlist`.
 */
function shufflePlaylist(array) {
  for (let i = array.length - 1; i > 0; i--) {
    // Pick a random index from 0 to i
    const j = Math.floor(Math.random() * (i + 1));
    // Swap elements array[i] and array[j]
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function flashButton(btn) {
  if (!btn || !(btn instanceof HTMLElement)) return;

  if (btn._timer) clearTimeout(btn._timer);

  btn.classList.add('is-pressed');

  btn._timer = setTimeout(function() {
    btn.classList.remove('is-pressed');
    btn.blur();
    if (document.activeElement) {
      document.activeElement.blur();
    }
  }, 1000);
}

     function nextTrack(e) {
    if (e && e.preventDefault) e.preventDefault();

  const btn = e ? (e.currentTarget || e.target) : null;
  flashButton(btn);

  if (isShuffleOn) {
    randomNextTrack();
    return;
  }
   currentIndex++;
   if (currentIndex >= activePlaylist.length) {
     currentIndex = 0;
   }

  renderTrackChange();
  }

    function randomNextTrack() {
    let newIndex;

    do {
      newIndex = getRandomTrackIndex();
    } while (newIndex === currentIndex && activePlaylist.length > 1);

    currentIndex = newIndex;

    renderTrackChange();
  }

   function advanceToNextTrack() {
  if (isShuffleOn) {
    randomNextTrack();
  } else {
   currentIndex++;
   if (currentIndex >= activePlaylist.length) {
     currentIndex = 0;
   }
    renderTrackChange();
  }
}

    function prevTrack(e) {
      if (e && e.preventDefault) e.preventDefault();

      const btn = e ? (e.currentTarget || e.target) : null;
      flashButton(btn);
      currentIndex--;
      if (currentIndex < 0) {
        currentIndex = activePlaylist.length - 1;
      }

      renderTrackChange();
    }

    function renderTrackChange() {
      const currentNum = currentIndex + 1;
     const trackElem = document.getElementById('trackInput');

      if (trackElem) {
        trackElem.value = currentNum;
      }

      const id = activePlaylist[currentIndex];
      const thumb = document.getElementById('trackThumb');

      if (thumb) {
        thumb.src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
      }

      if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
        ytPlayer.loadVideoById(id);
      }

      fetchTrackTitle();
    }

   function jumpToTrack(val) {
  const requestedNum = parseInt(val, 10);
  const minTrack = 1;
  const maxTrack = activePlaylist.length;

  if (
    !isNaN(requestedNum) &&
    requestedNum >= minTrack &&
    requestedNum <= maxTrack
  ) {
    currentIndex = requestedNum - 1;
    renderTrackChange();
  } else {
    const trackElem = document.getElementById('trackInput');
    if (trackElem) {
      trackElem.value = currentIndex + 1;
    }
  }
}

let initialLoad = true;
function onPlayerStateChange(event) {
  const btn = document.getElementById('playBtn');

  if (initialLoad && event.data === YT.PlayerState.PLAYING) {
    initialLoad = false;

    event.target.pauseVideo();
    event.target.unMute();
    event.target.setVolume(100);

    isAudioMuted = false;

    btn.innerText = '▶';
    btn.classList.add('is-paused');

    updateMuteUI();
    updateUI(event);

    return;
  }

  if (event.data === YT.PlayerState.PLAYING) {
    btn.innerText = '⏸';
    btn.classList.remove('is-paused');
    document.getElementById('trackThumb').classList.add('is-playing');
    fetchTrackTitle();

  } else if (event.data === YT.PlayerState.PAUSED) {
    btn.innerText = '▶';
    btn.classList.add('is-paused');
    document.getElementById('trackThumb').classList.remove('is-playing');

  } else if (event.data === YT.PlayerState.ENDED) {
    document.getElementById('trackThumb').classList.remove('is-playing');
    advanceToNextTrack();
  }
}   

    function onPlayerError(event) {
      console.warn(`Track ${currentIndex + 1} is unplayable. Skipping...`);
      advanceToNextTrack();
    }
