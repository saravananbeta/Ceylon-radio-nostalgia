.controls button {

/* Force dark style on touch focus, active, and native hover states */
.controls button:focus,
.controls button:active,

  background: rgba(255, 255, 255, 0.1) !important;
  color: #ffffff !important;
  outline: none !important;
  box-shadow: none !important;
}

/* Desktop-only hover (Will NOT trigger on touchscreens) */
@media (hover: hover) and (pointer: fine) {
  .controls button:hover {
    background: #ffb703 !important;

  }
}

/* Temporary 1-second JS class (The ONLY way a button turns yellow on mobile) */

 /* Keep Play/Pause yellow while paused */

  <script>
    /* Digital Clock Logic */

      document.getElementById('clockDisplay').innerText = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    const playlist = [

      "X5xgvkleCVY", "amrYH0MLNpc", "MoRV_104F88", "q9295zePSH4", "LdcFkET5McQ", "_o0XDL5r2o4", "3xp07YWP7Yc", "z_QFAJe4LzE",
      "Z-1xce1ybzc", "1nmqTjxjYaA", "E0_A1dGNKr8", "ocBoMj43OeA", "zldQeFNHaGQ", "rRgKK6fcMpI", "PNURrNiXP6c", "EAd-F8e_Xdg",
      "bosqsctO-Ts", "hhBbRZpEXOA", "hUIAaAq8-mk", "6FXW-UbRtxs", "5a3uZAkGd-g", "1ipzjG4uP2I", "4JM2oOoGqc", 
      "VfNXHqZqKVc", "nWwRBi1wxDA", "j2u5CP1tZgE", "qkmjQtvrHbs", "5gjmeNLDnWE", "KMVSNHl03UY", "nnCVegbJBn0", "5uafA1pAWow", 
      "oFY6TsrnVpg", "knc2mBi6J8E", "om3c_RK3-zI", "Th-9495kgew", "qZKc2z4k0v4", "agGKSCj8hOY", "1sPCgElDxbY", "BueLii2m8e8", 
      "oC4ndv87Whk", "THnIF0rNXNY", "TeYTRiVUGBE", "lmhUAqYJtxc", "yM6WXTyJRrk", "wSXSn1kC3XM", "q9YcaJMo9ZY", "Qm6WA6ba8dw",   
      "FokCytPfneM", "ePYw-O2pCfM", "lQosvjFn6yk"
    ];

    // Decade ranges: 80s = tracks 1-26, 70s = tracks 27-90.
    // Playlist indexes are zero-based: 0-25 and 26-89.
    const decadeRanges = {
      '80s': { start: 0, end: 25 },
      '70s': { start: 26, end: 89 }
    };

    let selectedDecade = '80s';

    function getCurrentRange() {
      return decadeRanges[selectedDecade];
    }

    function getRandomTrackIndex() {
      const range = getCurrentRange();
      return Math.floor(Math.random() * (range.end - range.start + 1)) + range.start;
    }

    // Default: random 80s track (1-26).
    let isShuffleOn = false;
    let currentIndex = decadeRanges['80s'].start; // Starts at index 0 (track 1)
    let ytPlayer;
    let isAudioMuted = true; // State tracker

function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('player', {
    height: '1',
    width: '1',
    videoId: playlist[currentIndex],
    playerVars: { 
      'autoplay': 1,      
      'mute': 1,          
      'controls': 0,
      'playsinline': 1
    },
    events: {
      'onReady': function(event) {
        if (isAudioMuted) {
          event.target.mute();
        } else {
          event.target.unMute();
          event.target.setVolume(100);
        }
        event.target.loadVideoById(playlist[currentIndex]);
        updateMuteUI(); 
        updateUI(event);
      },
      'onStateChange': onPlayerStateChange,
      'onError': onPlayerError
    }
  });
}

// Global listener: Unmute on first click anywhere outside the mute button
document.addEventListener('click', function unmuteOnFirstClick(e) {
  if (e.target.closest('#muteBtn')) return; // Let the button handler manage its own click

  if (isAudioMuted) {
    isAudioMuted = false;
    if (ytPlayer && typeof ytPlayer.unMute === 'function') {
      ytPlayer.unMute();
      ytPlayer.setVolume(100);
    }
    updateMuteUI();
  }
}, { once: true });

// Dedicated Mute/Unmute Button Handler
document.addEventListener('DOMContentLoaded', function() {
  const muteBtn = document.getElementById('muteBtn');
  if (muteBtn) {
    muteBtn.addEventListener('click', function() {
      isAudioMuted = !isAudioMuted;

      if (ytPlayer && typeof ytPlayer.unMute === 'function') {
        if (isAudioMuted) {
          ytPlayer.mute();
        } else {
          ytPlayer.unMute();
          ytPlayer.setVolume(100);
        }
      }
      updateMuteUI();
    });
  }
});

// Sync icon strictly based on state variable
function updateMuteUI() {
  const muteIcon = document.getElementById('muteIcon');
  const muteBtn = document.getElementById('muteBtn');
  if (!muteIcon) return;

  if (isAudioMuted) {
    muteIcon.textContent = '🔇'; // MUTED
    if (muteBtn) muteBtn.classList.add('is-muted');
  } else {
    muteIcon.textContent = '🔊'; // UNMUTED
    if (muteBtn) muteBtn.classList.remove('is-muted');
  }
}

if (window.YT && window.YT.Player) {
  onYouTubeIframeAPIReady();
}
    
    function updateUI() {
      const id = playlist[currentIndex];
      document.getElementById('trackThumb').src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
      document.getElementById('trackInput').value = currentIndex + 1;
      
      // Temporary title until YouTube returns actual title
      fetchTrackTitle();
    }

    function fetchTrackTitle() {
      if (ytPlayer && ytPlayer.getVideoData) {
        const title = ytPlayer.getVideoData().title;
        if (title) {
          document.getElementById('trackTitle').innerText = title;
          document.getElementById('trackTitle').title = title;
          return;
        }
      }
      document.getElementById('trackTitle').innerText = `Track ${currentIndex + 1}`;
    }

    function togglePlay() {
      if (!ytPlayer) return;
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

   // Flash animation handler
function flashButton(btn) {
  if (!btn || !(btn instanceof HTMLElement)) return;

  // Clear any existing timer
  if (btn._timer) clearTimeout(btn._timer);

  btn.classList.add('is-pressed');

  btn._timer = setTimeout(function() {
    btn.classList.remove('is-pressed');
    btn.blur();
    if (document.activeElement) {
      document.activeElement.blur();
    }
  }, 1000);
}

   function changeDecade(decade) {
  if (!decadeRanges[decade]) return;

  selectedDecade = decade;
  const range = getCurrentRange();

  // Pick starting track for selected decade
  currentIndex = isShuffleOn ? getRandomTrackIndex() : range.start;

  const trackInput = document.getElementById('trackInput');
  if (trackInput) {
    trackInput.min = range.start + 1;
    trackInput.max = range.end + 1;
    trackInput.value = currentIndex + 1;
  }

  // Load selected track into YouTube engine
  const id = playlist[currentIndex];
  if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
    ytPlayer.loadVideoById(id);
  }

  updateUI();
}

     function toggleShuffle() {
  isShuffleOn = !isShuffleOn;
  const btn = document.getElementById('shuffleBtn');
  if (btn) {
    if (isShuffleOn) {
      btn.classList.add('is-active');
    } else {
      btn.classList.remove('is-active');
    }
  }
}

     function nextTrack(e) {
    if (e && e.preventDefault) e.preventDefault();

  const btn = e ? (e.currentTarget || e.target) : null;
  flashButton(btn);

  if (isShuffleOn) {
    randomNextTrack();
    return;
  }

  const range = getCurrentRange();
  currentIndex++;
  if (currentIndex > range.end) {
    currentIndex = range.start;
  }

  renderTrackChange();
  }
    function randomNextTrack() {
   const range = getCurrentRange();

   let newIndex;

   do {
    newIndex = getRandomTrackIndex();
   } while (newIndex === currentIndex && range.start !== range.end);

    currentIndex = newIndex;

    renderTrackChange();
  }


   function advanceToNextTrack() {
  if (isShuffleOn) {
    randomNextTrack();
  } else {
    const range = getCurrentRange();
    currentIndex++;
    if (currentIndex > range.end) {
      currentIndex = range.start;
    }
    renderTrackChange();
  }
}

    function prevTrack(e) {
      if (e && e.preventDefault) e.preventDefault();

      const btn = e ? (e.currentTarget || e.target) : null;
      flashButton(btn);

      const range = getCurrentRange();

      currentIndex--;
      if (currentIndex < range.start) {
        currentIndex = range.end;
      }

      renderTrackChange();
    }

    function renderTrackChange() {
      const currentNum = currentIndex + 1;
      const trackElem = document.getElementById('trackInput');

      if (trackElem) {
        trackElem.value = currentNum;
      }

      const id = playlist[currentIndex];
      const thumb = document.getElementById('trackThumb');

      if (thumb) {
        thumb.src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
      }

      if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
        ytPlayer.loadVideoById(id);
      }

      fetchTrackTitle();
    }

   function jumpToTrack(val) {
  const requestedNum = parseInt(val, 10);
  const range = getCurrentRange();

  const minTrack = range.start + 1;
  const maxTrack = range.end + 1;

  if (
    !isNaN(requestedNum) &&
    requestedNum >= minTrack &&
    requestedNum <= maxTrack
  ) {
    currentIndex = requestedNum - 1;
    renderTrackChange();
  } else {
    const trackElem = document.getElementById('trackInput');
    if (trackElem) {
      trackElem.value = currentIndex + 1;
    }
  }
}

    // Automatically bind touch-blur handlers to all control buttons on mobile load
document.addEventListener('DOMContentLoaded', function() {
  const buttons = document.querySelectorAll('.controls button');
  buttons.forEach(function(btn) {
    btn.addEventListener('touchend', function() {
      // Strips touch focus immediately when finger leaves screen
      setTimeout(() => btn.blur(), 50);
    });
  });
});
    function setVolume(val) {
      if (ytPlayer && ytPlayer.setVolume) {
        ytPlayer.setVolume(val);
      }
    }

    function onPlayerStateChange(event) {
  const btn = document.getElementById('playBtn');
  if (!btn) return;

  if (event.data === YT.PlayerState.PLAYING) {
    btn.innerText = '⏸';
    btn.classList.remove('is-paused'); // Returns to default background while playing
    fetchTrackTitle();
  } else if (event.data === YT.PlayerState.PAUSED) {
    btn.innerText = '▶';
    btn.classList.add('is-paused');    // Stays yellow while paused
  } else if (event.data === YT.PlayerState.ENDED) {
    btn.classList.remove('is-paused');
    advanceToNextTrack();
  }
}
    function onPlayerError(event) {
      console.warn(`Track ${currentIndex + 1} is unplayable. Skipping...`);
      advanceToNextTrack();
    }

// Initialize with a random starting count between 10 and 25
let currentCount = Math.floor(Math.random() * (25 - 10 + 1)) + 10;

function updateFakeListeners() {
  const countElem = document.getElementById('listenerCount');
  
  if (countElem) {
    // Update DOM with current count
    countElem.innerText = `Online: ${currentCount}`;
    
    // Generate a delta between -2 and +2
    const delta = Math.floor(Math.random() * 5) - 2;
    
    // Apply delta, ensuring the count doesn't drop below 0
    currentCount = Math.max(5, currentCount + delta);
  }
}

// Run immediately on page load
updateFakeListeners();

// Update every 15 seconds (15000 ms)
setInterval(updateFakeListeners, 15000);
